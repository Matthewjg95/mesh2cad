name: Optimization experiment tests

on:
  pull_request:
    paths:
      - "mra/optimization/**"
      - "tests/test_optimization.py"
      - ".github/workflows/optimization-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install narrow test dependencies
        run: python -m pip install pytest numpy scipy trimesh networkx
      - name: Run optimizer tests
        run: python -m pytest -q tests/test_optimization.py
